<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/contributors/ojara/style.css">
    <title>MEDEASE | OJARA</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./images/Logo.png" alt="">
        </div>
        <nav>
            <ul>
                <li>Home</li>
                <li>Services</li>
                <li>Find a doctor</li>
                <li>About us</li>
            </ul>

        </nav>
        <button class="btn btn-fill">Register</button>
    </header>

    <section class="hero-section">
        <div class="hero-content">
            <div class="badge">
                <img src="./images/Star.png" alt="">
                <p class="paragraph-500">Rated #1 choice for healthcare appointments by users</p>
            </div>

            <h1 class="hero-title">
                Connecting You <span>to </span>Better Health
            </h1>
            <p class="hero-text">We're here to link you directly to improved health outcomes, effortlessly connecting you with the care you need.</p>

            <div class="btn-group">
                <button class="btn btn-fill">Book Consultation</button>
                <button class="btn btn-outline">Learn more</button>
            </div>
        </div>
        <div class="hero-image">
            <img src="./images/doctor.png" alt="">

        </div>

    </section>
    
</body>
</html>
